<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>男性随机人设库生成器</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --card-hover: #263449;
    --border: #334155;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --accent: #38bdf8;
    --accent-hover: #0284c7;
    --tag-bg: rgba(56, 189, 248, 0.12);
    --tag-text: #7dd3fc;
    --lock-active: #f59e0b;
    --success: #10b981;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    padding: 20px 16px 60px;
  }
  .container {
    max-width: 960px;
    margin: 0 auto;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  h1 {
    font-size: 1.4rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: #fff;
  }
  .subtitle {
    font-size: 0.85rem;
    color: var(--text-muted);
  }
  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 20px;
  }
  .panel-title {
    font-size: 0.95rem;
    font-weight: 600;
    margin-bottom: 12px;
    color: var(--accent);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .pref-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(185px, 1fr));
    gap: 12px;
  }
  .pref-item {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .pref-item label {
    font-size: 0.8rem;
    color: var(--text-muted);
  }
  select, input[type="number"] {
    background: #0f172a;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 0.88rem;
    outline: none;
  }
  select:focus, input[type="number"]:focus {
    border-color: var(--accent);
  }
  .age-range {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .age-range input {
    width: 100%;
  }
  .btn-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 20px;
  }
  button {
    cursor: pointer;
    border: none;
    border-radius: 8px;
    padding: 9px 15px;
    font-size: 0.88rem;
    font-weight: 600;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn-primary {
    background: var(--accent);
    color: #0f172a;
  }
  .btn-primary:hover {
    background: #7dd3fc;
  }
  .btn-secondary {
    background: #334155;
    color: var(--text);
  }
  .btn-secondary:hover {
    background: #475569;
  }
  .btn-outline {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
  }
  .btn-outline:hover {
    border-color: var(--text);
    color: var(--text);
  }
  .persona-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 18px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
  }
  .persona-header {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    padding-bottom: 14px;
    margin-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }
  .name-block {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 12px;
  }
  .real-name {
    font-size: 1.55rem;
    font-weight: 700;
    color: #fff;
  }
  .net-name {
    font-size: 0.95rem;
    color: var(--accent);
    background: var(--tag-bg);
    padding: 2px 10px;
    border-radius: 99px;
  }
  .quick-badges {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .badge {
    font-size: 0.8rem;
    padding: 3px 10px;
    border-radius: 6px;
    background: #0f172a;
    border: 1px solid var(--border);
    color: var(--text);
  }
  .attr-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
    gap: 12px;
  }
  .attr-box {
    background: #131c2e;
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 10px;
    padding: 11px 13px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 6px;
  }
  .attr-box.full-width {
    grid-column: 1 / -1;
  }
  .attr-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .attr-label {
    font-size: 0.78rem;
    color: var(--text-muted);
    font-weight: 600;
  }
  .attr-actions {
    display: flex;
    gap: 4px;
  }
  .icon-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    padding: 2px 6px;
    font-size: 0.76rem;
    border-radius: 4px;
    cursor: pointer;
  }
  .icon-btn:hover {
    background: rgba(255, 255, 255, 0.08);
    color: #fff;
  }
  .icon-btn.locked {
    color: var(--lock-active);
    background: rgba(245, 158, 11, 0.14);
  }
  .attr-val {
    font-size: 0.93rem;
    color: var(--text);
    word-break: break-word;
  }
  .toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: var(--success);
    color: #052e16;
    padding: 10px 18px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.88rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    z-index: 999;
  }
  .toast.show {
    opacity: 1;
  }
  .export-area {
    width: 100%;
    height: 150px;
    background: #0f172a;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    font-family: monospace;
    font-size: 0.84rem;
    resize: vertical;
    margin-top: 10px;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>男性随机人设库生成器</h1>
      <div class="subtitle">包含全量词库 · 支持偏好筛选、单项锁定重随、一键复制与导出</div>
    </div>
    <div id="poolStats" class="subtitle"></div>
  </header>

  <div class="panel">
    <div class="panel-title">
      <span>随机偏好设置</span>
      <button class="btn-outline" style="padding:4px 10px;font-size:0.78rem;" onclick="resetPreferences()">重置偏好</button>
    </div>
    <div class="pref-grid">
      <div class="pref-item">
        <label>姓名偏好</label>
        <select id="prefNameLen">
          <option value="all">全部（二字 + 三字）</option>
          <option value="3">仅三字或复姓</option>
          <option value="2">仅二字单名</option>
        </select>
      </div>
      <div class="pref-item">
        <label>年龄范围（18 - 40 岁）</label>
        <div class="age-range">
          <input type="number" id="prefAgeMin" min="18" max="40" value="18">
          <span>至</span>
          <input type="number" id="prefAgeMax" min="18" max="40" value="40">
        </div>
      </div>
      <div class="pref-item">
        <label>感情状态限定</label>
        <select id="prefRel">
          <option value="all">全部随机</option>
          <option value="单身">单身</option>
          <option value="失恋">失恋</option>
          <option value="在交往">在交往</option>
          <option value="订婚">订婚</option>
          <option value="已婚">已婚</option>
          <option value="离异">离异</option>
        </select>
      </div>
      <div class="pref-item">
        <label>网名风格</label>
        <select id="prefNickStyle">
          <option value="all">综合（结合真名与人设）</option>
          <option value="name">真名衍生风</option>
          <option value="persona">身份/气味意境风</option>
          <option value="minimal">极简高冷风</option>
        </select>
      </div>
      <div class="pref-item">
        <label>身份标签叠加数</label>
        <select id="prefIdCount">
          <option value="1">1 个身份标签</option>
          <option value="2" selected>2 个身份标签</option>
          <option value="3">3 个身份标签</option>
        </select>
      </div>
      <div class="pref-item">
        <label>外貌特征叠加数</label>
        <select id="prefAppCount">
          <option value="1">1 组外貌描述</option>
          <option value="2" selected>2 组外貌描述</option>
        </select>
      </div>
      <div class="pref-item">
        <label>生理特征开关</label>
        <select id="prefShowNsfw">
          <option value="show" selected>显示完整生理特征</option>
          <option value="hide">隐藏生理特征</option>
        </select>
      </div>
      <div class="pref-item">
        <label>单次生成人数</label>
        <select id="prefBatchCount">
          <option value="1" selected>单人精细模式（支持锁定）</option>
          <option value="3">批量生成 3 人</option>
          <option value="5">批量生成 5 人</option>
          <option value="10">批量生成 10 人</option>
        </select>
      </div>
    </div>
  </div>

  <div class="btn-bar">
    <button class="btn-primary" onclick="generatePersonas()">🎲 重新随机生成</button>
    <button class="btn-secondary" onclick="unlockAll()">🔓 解锁全部属性</button>
    <button class="btn-secondary" onclick="copyTextReport()">📋 一键复制文本</button>
    <button class="btn-secondary" onclick="downloadFile('txt')">💾 导出 TXT</button>
    <button class="btn-secondary" onclick="downloadFile('json')">📦 导出 JSON</button>
  </div>

  <div id="cardsContainer"></div>

  <div class="panel">
    <div class="panel-title">
      <span>纯文本预览 / 快速复制区（无特殊符号、可直接粘贴）</span>
    </div>
    <textarea id="exportPreview" class="export-area" readonly></textarea>
  </div>
</div>

<div id="toast" class="toast">已复制到剪贴板</div>

function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function pickMultiple(arr, count) {
  const copy = [...arr];
  const out = [];
  for (let i = 0; i < count && copy.length > 0; i++) {
    const idx = Math.floor(Math.random() * copy.length);
    out.push(copy.splice(idx, 1)[0]);
  }
  return out;
}

function randInt(min, max) {
  const a = Math.min(min, max);
  const b = Math.max(min, max);
  return Math.floor(Math.random() * (b - a + 1)) + a;
}

function generateNetName(realName, job, scent, identity, stylePref) {
  const given = realName.length >= 3 ? realName.slice(-2) : realName.slice(-1);
  const lastChar = realName.slice(-1);
  const firstChar = realName.slice(0, 1);
  const cleanScent = scent.replace(/味|香|气息|清香|微香|清爽|清甜/g, "");
  const cleanId = identity.replace(/爱好者|玩家|常客|达人|收藏家|藏家|练习者|习练者|饲主|业主|住户/g, "");
  const cleanJob = job.replace(/师|员|家|主理人|店主|教练/g, "");

  const namePatterns = [
    `${given}`,
    `${firstChar}${lastChar}.`,
    `${given}不熬夜`,
    `${given}今天休息`,
    `是${given}啊`,
    `${lastChar}先生`,
    `借一程${given}`,
    `${given}的备忘录`,
    `人间${given}`
  ];
  const personaPatterns = [
    `${cleanScent}与${lastChar}`,
    `${cleanScent}标本`,
    `${cleanId}${firstChar}某`,
    `半杯${cleanScent}`,
    `在逃${cleanJob}`,
    `${cleanScent}收藏夹`,
    `听风与${lastChar}`,
    `第${randInt(1,99)}号${cleanId}`
  ];
  const minimalPatterns = [
    `${lastChar}.`,
    `_${given}`,
    `${firstChar}·${lastChar}`,
    `0x${lastChar}`,
    `${given}Studio`,
    `山海与${lastChar}`,
    `不语${lastChar}`
  ];

  if (stylePref === "name") return pick(namePatterns);
  if (stylePref === "persona") return pick(personaPatterns);
  if (stylePref === "minimal") return pick(minimalPatterns);
  return pick([...namePatterns, ...personaPatterns, ...minimalPatterns]);
}

    appCount: parseInt(document.getElementById("prefAppCount").value) || 2,
    showNsfw: document.getElementById("prefShowNsfw").value === "show",
    batchCount: parseInt(document.getElementById("prefBatchCount").value) || 1
  };
}

function rollField(field, currentPersona, prefs) {
  let namePool = [...DB.names3, ...DB.names2];
  if (prefs.nameLen === "3") namePool = DB.names3;
  if (prefs.nameLen === "2") namePool = DB.names2;

  switch (field) {
    case "realName":
      return pick(namePool);
    case "age":
      return randInt(prefs.ageMin, prefs.ageMax) + "岁";
    case "relationship":
      return prefs.rel === "all" ? pick(DB.relationships) : prefs.rel;
    case "identity":
      return pickMultiple(DB.identities, prefs.idCount).join("，");
    case "job":
      return pick(DB.jobs);
    case "education":
      return pick(DB.educations);
    case "scent":
      return pick(DB.scents);
    case "appearance":
      return pickMultiple(DB.appearances, prefs.appCount).join("，");
    case "body":
      return pick(DB.bodies);
    case "location":
      return pick(DB.locations);
    case "fashion":
      return pickMultiple(DB.fashions, 2).join("，");
    case "signature":
      return pick(DB.signatures);
    case "physio":
      return pick(DB.physios);
    case "netName":
      return generateNetName(
        currentPersona.realName || pick(namePool),
        currentPersona.job || pick(DB.jobs),
        currentPersona.scent || pick(DB.scents),
        (currentPersona.identity || pick(DB.identities)).split("，")[0],
        prefs.nickStyle
      );
  }
}

function buildOnePersona(existing = {}, useLocks = false) {
  const prefs = getPrefs();
  const p = {};
  const baseFields = [
    "realName", "age", "relationship", "identity", "job",
    "education", "scent", "appearance", "body", "location",
    "fashion", "signature", "physio"
  ];
  baseFields.forEach(f => {
    if (useLocks && locks[f] && existing[f]) {
      p[f] = existing[f];
    } else {
      p[f] = rollField(f, p, prefs);
    }
  });
  if (useLocks && locks["netName"] && existing["netName"]) {
    p.netName = existing.netName;
  } else {
    p.netName = rollField("netName", p, prefs);
  }
  return p;
}

function generatePersonas() {
  const prefs = getPrefs();
  if (prefs.batchCount === 1) {
    const prev = personas[0] || {};
    personas = [buildOnePersona(prev, true)];
  } else {
    personas = [];
    for (let i = 0; i < prefs.batchCount; i++) {
      personas.push(buildOnePersona({}, false));
    }
  }
  renderAll();
}

function rerollSingle(index, field) {
  const prefs = getPrefs();
  const p = personas[index];
  p[field] = rollField(field, p, prefs);
  if (field === "realName" && !locks["netName"]) {
    p.netName = rollField("netName", p, prefs);
  }
  renderAll();
}

function toggleLock(field) {
  locks[field] = !locks[field];
  renderAll();
}

function unlockAll() {
  locks = {};
  renderAll();
  showToast("已解锁所有属性");
}

function resetPreferences() {
  document.getElementById("prefNameLen").value = "all";
  document.getElementById("prefAgeMin").value = 18;
  document.getElementById("prefAgeMax").value = 40;
  document.getElementById("prefRel").value = "all";
  document.getElementById("prefNickStyle").value = "all";
  document.getElementById("prefIdCount").value = "2";
  document.getElementById("prefAppCount").value = "2";
  document.getElementById("prefShowNsfw").value = "show";
  document.getElementById("prefBatchCount").value = "1";
  generatePersonas();
}

const FIELD_META = [
  { key: "realName", label: "真名", full: false },
  { key: "netName", label: "网名", full: false },
  { key: "age", label: "年龄", full: false },
  { key: "relationship", label: "感情状态", full: false },
  { key: "job", label: "职业", full: false },
  { key: "education", label: "学历", full: false },
  { key: "scent", label: "气味", full: false },
  { key: "location", label: "所在地", full: false },
  { key: "identity", label: "身份标签", full: true },
  { key: "fashion", label: "穿衣风格", full: true },
  { key: "appearance", label: "外貌特征", full: true },
  { key: "body", label: "身材比例", full: true },
  { key: "signature", label: "个性签名", full: true },
  { key: "physio", label: "生理特征与性爱风格", full: true, nsfw: true }
];

function renderAll() {
  const prefs = getPrefs();
  const container = document.getElementById("cardsContainer");
  const isSingle = personas.length === 1;

  container.innerHTML = personas.map((p, idx) => {
    const attrsHtml = FIELD_META.filter(m => !m.nsfw || prefs.showNsfw).map(m => {
      const isLocked = isSingle && locks[m.key];
      return `
        <div class="attr-box ${m.full ? 'full-width' : ''}">
          <div class="attr-top">
            <span class="attr-label">${m.label}</span>
            <div class="attr-actions">
              <button class="icon-btn" title="单独重随此项" onclick="rerollSingle(${idx}, '${m.key}')">↻ 重随</button>
              ${isSingle ? `<button class="icon-btn ${isLocked ? 'locked' : ''}" title="锁定/解锁此项" onclick="toggleLock('${m.key}')">${isLocked ? '🔒 已锁' : '🔓 锁定'}</button>` : ''}
            </div>
          </div>
          <div class="attr-val">${p[m.key]}</div>
        </div>
      `;
    }).join("");

    return `
      <div class="persona-card">
        <div class="persona-header">
          <div class="name-block">
            <span class="real-name">${p.realName}</span>
            <span class="net-name">@${p.netName}</span>
          </div>
          <div class="quick-badges">
            <span class="badge">${p.age}</span>
            <span class="badge">${p.relationship}</span>
            <span class="badge">${p.job}</span>
            <span class="badge">${p.scent}</span>
          </div>
        </div>
        <div class="attr-grid">
          ${attrsHtml}
        </div>
      </div>
    `;
  }).join("");

  updateExportPreview();
}

function formatPlainText() {
  const prefs = getPrefs();
  return personas.map((p, i) => {
    const lines = [
      personas.length > 1 ? `人设编号：${i + 1}` : null,
      `真名：${p.realName}`,
      `网名：${p.netName}`,
      `年龄：${p.age}`,
      `感情状态：${p.relationship}`,
      `身份：${p.identity}`,
      `职业：${p.job}`,
      `学历：${p.education}`,
      `气味：${p.scent}`,
      `穿衣风格：${p.fashion}`,
      `所在地：${p.location}`,
      `外貌：${p.appearance}`,
      `身材：${p.body}`,
      `个性签名：${p.signature}`,
      prefs.showNsfw ? `生理特征：${p.physio}` : null
    ].filter(Boolean);
    return lines.join("\n");
  }).join("\n\n");
}

function updateExportPreview() {
  document.getElementById("exportPreview").value = formatPlainText();
}

function copyTextReport() {
  const text = formatPlainText();
  const textarea = document.getElementById("exportPreview");
  textarea.select();
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => showToast("已复制纯文本人设")).catch(() => {
      document.execCommand("copy");
      showToast("已复制纯文本人设");
    });
  } else {
    document.execCommand("copy");
    showToast("已复制纯文本人设");
  }
}

function downloadFile(type) {
  let content = "";
  let mime = "text/plain;charset=utf-8";
  let ext = "txt";
  if (type === "json") {
    content = JSON.stringify(personas, null, 2);
    mime = "application/json;charset=utf-8";
    ext = "json";
  } else {
    content = formatPlainText();
  }
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const firstName = personas[0] ? personas[0].realName : "随机人设";
  a.href = url;
  a.download = `人设导出_${firstName}_${personas.length}人.${ext}`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast(`已导出 ${ext.toUpperCase()} 文件`);
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1800);
}

window.addEventListener("DOMContentLoaded", () => {
  const totalNames = DB.names3.length + DB.names2.length;
  document.getElementById("poolStats").textContent =
    `词库规模：姓名 ${totalNames} · 身份 ${DB.identities.length} · 职业 ${DB.jobs.length} · 外貌 ${DB.appearances.length}`;
  generatePersonas();
});
</script>
</body>
